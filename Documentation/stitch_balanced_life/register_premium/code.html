<style>
        body {
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(circle at top left, #9cebe8 0%, #f8faf1 40%, #ff98cd 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex items-center justify-center p-6 selection:bg-primary-container">
<main class="w-full max-w-md">
<!-- Logo and Intro Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-xl mb-6 glass-card">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="potted_plant" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
</div>
<h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-2">Create Account</h1>
<p class="text-on-surface-variant font-medium">Start your journey to a Balanced Life</p>
</div>
<!-- Registration Card -->
<div class="glass-card p-8 rounded-lg shadow-2xl">
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="name">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white/50 border-none rounded-xl ring-1 ring-outline-variant focus:ring-2 focus:ring-primary focus:bg-white transition-all text-on-surface placeholder:text-outline-variant outline-none" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white/50 border-none rounded-xl ring-1 ring-outline-variant focus:ring-2 focus:ring-primary focus:bg-white transition-all text-on-surface placeholder:text-outline-variant outline-none" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-white/50 border-none rounded-xl ring-1 ring-outline-variant focus:ring-2 focus:ring-primary focus:bg-white transition-all text-on-surface placeholder:text-outline-variant outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-dim active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Create Free Account</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="px-4 bg-transparent text-outline font-bold tracking-widest">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-white/60 hover:bg-white rounded-xl border border-outline-variant/20 transition-all font-semibold text-on-surface-variant">
<img alt="" class="w-5 h-5" data-alt="Google colorful brand logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYPVvHKJF1MiaIyGFvI8P4uNpGrkUkZBM-8x89VrCv_DFKdui8-lxtxOD-Imu463uy0UkV5g_t_1JkhKYxbIkYekMlupSTiAxcv6P7TR2tksT6n2pCMnJj9m3EUDgI9FWFnBcSCuD6oRd4xCCavrCBEKekcTfXnq-WkykGWdO1QS9wl-rVakRdLiu4hsjJOqE8dua2De2cJZ79hIzan1fJx6FIHtCj_YXJzIo09WY_GgHTqQzZOkz13bK_-msx2LLKC6KE_9SVWYQ"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-white/60 hover:bg-white rounded-xl border border-outline-variant/20 transition-all font-semibold text-on-surface-variant">
<span class="material-symbols-outlined text-on-surface" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Footer -->
<p class="text-center mt-10 text-on-surface-variant font-medium">
            Already have an account? 
            <a class="text-primary font-bold hover:underline" href="#">Sign In</a>
</p>
<!-- Secondary Motivational Badge -->
<div class="mt-12 flex justify-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-white/30 rounded-full border border-white/40 text-sm font-medium text-primary">
<span class="material-symbols-outlined text-lg" data-icon="verified_user">verified_user</span>
<span>Join 20,000+ mindful members</span>
</div>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-20 right-[-5%] w-64 h-64 bg-tertiary-fixed-dim/20 blur-[80px] rounded-full -z-10"></div>
<div class="fixed bottom-10 left-[-5%] w-80 h-80 bg-primary-fixed-dim/30 blur-[100px] rounded-full -z-10"></div>
</body></html>
